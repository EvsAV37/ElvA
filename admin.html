<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>html, body{ background: #03070a; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03070a">
<title>Админ-панель</title>
<link rel="preload" href="elva-manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="elva-unbounded.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family: 'Manrope';
    src: url('elva-manrope.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: block;
  }
  @font-face{
    font-family: 'Unbounded';
    src: url('elva-unbounded.woff2') format('woff2');
    font-weight: 500 700; font-style: normal; font-display: block;
  }
  :root{
    --night: #10142A;
    --surface: #1A2044;
    --surface-2: #232B58;
    --ice: #8FE0E8;
    --ice-dim: #5C7A8A;
    --amber: #F2A65A;
    --text: #EDEFF5;
    --muted: #8089AC;
    --success: #7FD9A6;
    --danger: #E8737B;
    --line: rgba(237,239,245,0.09);

    /* Единый вид — те же размеры, что в приложении (index.html).
       Новые блоки берут размеры отсюда, своих не заводить. */
    --fs-xl: 24px;   /* заголовок экрана */
    --fs-l: 20px;    /* главное в карточке: имя, номер, цифры */
    --fs-m: 16px;    /* обычный текст, кнопки, поля */
    --fs-s: 14px;    /* подписи и пояснения, серым */
    --fs-xs: 12px;   /* мелкие пометки: статус, метки */
    --btn-h: 48px;   /* высота кнопок, полей, плашек выбора и вкладок */
    --r-card: 16px;  /* карточка на экране */
    --r-in: 12px;    /* карточка внутри карточки, кнопка, поле */
  }
  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  html{ background: #03070a; -webkit-text-size-adjust: 100%; }
  body{
    margin: 0; min-height: 100vh;
    background: var(--night);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: var(--fs-m); line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .shell{ max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1{
    font-family: 'Unbounded', sans-serif; font-weight: 600;
    font-size: var(--fs-xl); line-height: 1.25; letter-spacing: -0.01em; margin: 0;
  }
  h2{ font-size: var(--fs-l); font-weight: 700; line-height: 1.3; margin: 0; }
  .brand{ color: var(--ice); }
  .muted{ color: var(--muted); }
  .small{ font-size: var(--fs-s); }

  /* Экраны — столбик с промежутком 16; внутри карточки — 12. */
  #screen-login:not([hidden]), #screen-recovery:not([hidden]), #screen-panel:not([hidden]), #tab-body{
    display: flex; flex-direction: column; gap: 16px;
  }
  .card{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0;
  }

  /* Поля */
  label{ display: block; font-size: var(--fs-s); color: var(--muted); font-weight: 600; margin: 0 0 -4px; }
  input, textarea{
    width: 100%; min-height: var(--btn-h); padding: 12px 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-in);
    font-family: inherit; font-size: var(--fs-m);   /* ровно 16: иначе iPhone приближает экран */
    outline: none; transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus{ border-color: var(--ice); }
  textarea{ resize: none; min-height: 88px; }

  /* Кнопки: три вида, одна высота (как в приложении).
     Главная голубая, обычная в рамке, тихая серая. Красная — только в окне подтверждения. */
  button{ font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-primary, .btn-call, .btn-ghost, .btn-danger{
    width: 100%; min-height: var(--btn-h); margin: 0; padding: 0 16px;
    border: 1px solid transparent; border-radius: var(--r-in);
    font-weight: 700; font-size: var(--fs-m); line-height: 1.2;
    display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  .btn-primary{ background: var(--ice); color: #0c2126; }
  .btn-call{ background: transparent; border-color: rgba(237,239,245,0.22); color: var(--text); }
  .btn-ghost{ background: transparent; border-color: var(--line); color: var(--muted); }
  .btn-danger{ background: var(--danger); color: #2a0b0e; }
  .btn-primary:disabled, .btn-danger:disabled{ opacity: 0.4; cursor: default; }
  .btn-stack{ display: flex; flex-direction: column; gap: 8px; }
  .btn-row{ display: flex; gap: 8px; }
  .btn-row > button{ flex: 1; }
  .link{
    background: none; border: none; color: var(--ice); font-weight: 600; font-size: var(--fs-m);
    padding: 12px 0; margin: -12px 0;   /* палец попадает легко, а место в строке — как у текста */
  }
  .msg{ font-size: var(--fs-s); line-height: 1.5; margin: 0; }
  .msg:empty{ display: none; }
  .msg.error, .form-error{ color: var(--danger); }
  .msg.ok{ color: var(--success); }
  .form-error{ font-size: var(--fs-s); line-height: 1.5; margin: 0; }
  .form-error:empty{ display: none; }

  /* Шапка и вкладки */
  .who{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: -8px; font-size: var(--fs-s); color: var(--muted);
  }
  .who span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .who .link{ font-size: var(--fs-s); flex-shrink: 0; }
  .tabs{
    display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab, .chip{
    flex-shrink: 0; min-height: var(--btn-h); padding: 0 16px; border-radius: var(--r-in);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--text); font-weight: 700; font-size: var(--fs-m); line-height: 1.2;
  }
  .tab{ color: var(--muted); }
  /* Выбранное — голубым, как время подачи и цвет машины в приложении. */
  .tab.active, .chip.on{ border-color: var(--ice); box-shadow: inset 0 0 0 1px var(--ice); color: var(--text); }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .chip{ flex: 1 1 auto; padding: 0 12px; }
  .chips.cols3{ display: grid; grid-template-columns: repeat(3, 1fr); }
  .chips.cols3 .chip{ padding: 0 4px; }

  /* Списки */
  .rows{ margin: -12px 0; }
  .row{ padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child{ border-bottom: none; }
  .row-main{ font-weight: 700; }
  .row-sub{ font-size: var(--fs-s); color: var(--muted); margin-top: 2px; }
  .soon, .people-empty{ text-align: center; color: var(--muted); padding: 40px 12px; }
  .note{
    font-size: var(--fs-s); color: var(--muted); line-height: 1.6;
    border-top: 1px solid var(--line); padding-top: 12px;
  }
  .note.plain{ border-top: none; padding-top: 0; }
  .note code{ color: var(--text); font-size: var(--fs-xs); }

  /* Люди */
  .search-row{ display: flex; gap: 8px; }
  .search-row input{ flex: 1; min-width: 0; }
  .search-row .btn-primary{ width: auto; flex-shrink: 0; padding: 0 20px; }
  .row.click{ cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tag{
    display: inline-block; font-size: var(--fs-xs); font-weight: 700; line-height: 1.5;
    padding: 1px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 3px;
    background: var(--surface); color: var(--ice);
  }
  .tag.red{ color: var(--danger); }
  .kv{ display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; align-items: baseline; }
  .kv dt{ color: var(--muted); font-size: var(--fs-s); }
  .kv dd{ margin: 0; }
  .phone-link{ color: var(--ice); font-weight: 700; text-decoration: none; font-size: var(--fs-l); margin-top: -8px; }
  .back{ align-self: flex-start; }
  .stat-line{ margin: 0; }
  .stat-line + .stat-line{ margin-top: -8px; }
  .order-status{ font-size: var(--fs-xs); font-weight: 700; }
  .order-status.done{ color: var(--success); }
  .order-status.cancelled{ color: var(--danger); }
  .order-status.live{ color: var(--ice); }
  .link-inline{ background: none; border: none; padding: 0; color: var(--ice); font: inherit; font-weight: 600; cursor: pointer; }

  /* Блокировка */
  .ban-box{
    border: 1px solid rgba(232,115,123,0.45); background: rgba(232,115,123,0.08);
    border-radius: var(--r-in); padding: 16px; line-height: 1.55;
  }
  .ban-box b{ color: var(--danger); }
  .warn{
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-in);
    padding: 12px 14px; font-size: var(--fs-s); line-height: 1.5;
  }

  /* Заказы: каждая — карточка внутри карточки (на тон темнее). */
  .orders-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .orders-list{ display: flex; flex-direction: column; gap: 12px; }
  .order{
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-in);
    padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  .order.stuck{ border-color: rgba(232,115,123,0.55); background: #241f40; }
  .order-route{ font-weight: 700; line-height: 1.35; }
  .order-meta{ font-size: var(--fs-s); color: var(--muted); line-height: 1.45; }
  .order-route + .order-meta, .order-meta + .order-meta{ margin-top: 2px; }
  .price{ color: var(--amber); font-weight: 700; }
  .order-people{ font-size: var(--fs-s); line-height: 1.6; }
  .order-people a{ color: var(--muted); text-decoration: none; }
  .stuck-badge{ color: var(--danger); font-weight: 700; }

  /* Цифры */
  #stats-body{ display: flex; flex-direction: column; gap: 12px; }
  #stats-body h2.sec{ margin-top: 12px; }
  .tiles{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile{
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-in);
    padding: 12px 14px; min-width: 0;
  }
  .tile .num{ font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: var(--fs-l); line-height: 1.3; }
  .tile .lbl{ font-size: var(--fs-s); color: var(--muted); margin-top: 2px; }
  .tile .sub{ font-size: var(--fs-xs); color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .tile.good .num{ color: var(--success); }
  .tile.bad .num{ color: var(--danger); }
  .tile.ice .num{ color: var(--ice); }
  .tile.money .num{ color: var(--amber); }
  .chart{ display: flex; align-items: flex-end; gap: 4px; height: 150px; }
  .bar{ flex: 1; min-width: 0; display: flex; flex-direction: column-reverse; height: 100%; }
  .bar .d{ background: var(--success); border-radius: 3px 3px 0 0; }
  .bar .c{ background: var(--danger); opacity: 0.85; }
  .bar .d + .c{ border-radius: 3px 3px 0 0; }
  .chart-labels{ display: flex; gap: 4px; margin-top: -6px; }
  .chart-labels span{ flex: 1; min-width: 0; text-align: center; font-size: var(--fs-xs); color: var(--muted); overflow: hidden; }
  .legend{ display: flex; gap: 16px; font-size: var(--fs-s); color: var(--muted); }
  .legend i{ display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

  /* Окно подтверждения снизу — как в приложении. На компьютере — по центру. */
  .confirm-overlay{
    position: fixed; inset: 0; z-index: 80;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(5,12,15,0.6);
    opacity: 0; transition: opacity 0.2s ease;
  }
  .confirm-overlay.open{ opacity: 1; }
  .confirm-sheet{
    width: 100%; max-width: 480px;
    background: var(--surface-2);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 24px 24px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
    transform: translateY(16px); transition: transform 0.2s ease;
  }
  .confirm-overlay.open .confirm-sheet{ transform: none; }
  .confirm-title{ font-weight: 700; font-size: var(--fs-l); line-height: 1.3; }
  .confirm-text{ color: var(--muted); font-size: var(--fs-s); line-height: 1.55; margin: -4px 0 4px; }
  .confirm-sheet .btn-stack{ margin-top: 4px; }
  @media (prefers-reduced-motion: reduce){
    .confirm-overlay, .confirm-sheet{ transition: none; }
  }

  /* Короткое сообщение внизу, гаснет само — вместо системных окон. */
  .toast{
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px); z-index: 90; max-width: 82%;
    padding: 14px 22px; border-radius: 999px;
    background: #fff; color: #17181c; font-size: var(--fs-m); line-height: 1.3; text-align: center;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce){ .toast{ transition: none; } }

  /* Телефон: карточка человека — столбик. */
  .people-split, #people-left, #people-right, .person-grid, #ban-slot{ display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #people-right:empty{ display: none; }

  /* ===== Компьютер: меню слева, содержимое справа, карточка рядом с поиском ===== */
  @media (min-width: 900px){
    .shell{ max-width: 1240px; padding: 28px 32px 48px; }
    #screen-login .card, #screen-recovery .card{ max-width: 420px; }
    #screen-panel:not([hidden]){
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-areas: "head who" "nav body";
      column-gap: 32px; row-gap: 24px; align-items: start;
    }
    #screen-panel > h1{ grid-area: head; align-self: center; }
    #screen-panel > .who{ grid-area: who; margin-top: 0; justify-content: flex-end; gap: 24px; }
    #screen-panel > .tabs{
      grid-area: nav; flex-direction: column; margin: 0; padding: 0; overflow: visible;
      position: sticky; top: 24px;
    }
    #screen-panel > .tabs .tab{ text-align: left; }
    #tab-body{ grid-area: body; min-width: 0; }
    .people-split{ display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
    #people-right:empty{ display: flex; }
    #people-left{ position: sticky; top: 24px; }
    .person-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .person-grid > .wide{ grid-column: 1 / -1; }
    .orders-list{ display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
    .row.click{ padding-left: 12px; padding-right: 12px; margin: 0 -12px; border-radius: var(--r-in); }
    .row.click:hover{ background: rgba(255,255,255,0.03); }
    .row.click.sel{ background: rgba(143,224,232,0.08); }
    .tiles{ grid-template-columns: repeat(3, 1fr); }
    .chart{ height: 200px; }
    .confirm-overlay{ align-items: center; }
    .confirm-sheet{ border-bottom: 1px solid var(--line); border-radius: 20px; padding-bottom: 24px; }
  }

  /* Нажатие видно: кнопка и строка списка при касании утапливаются и темнеют.
     На iPhone без этого нажатие никак не отображается. */
  button, .row.click{ transition: transform 0.1s ease, filter 0.12s ease, background-color 0.12s ease; }
  button:not(:disabled):active{ transform: scale(0.96); filter: brightness(0.85); }
  .btn-ghost:not(:disabled):active{ background-color: rgba(237,239,245,0.08); }
  .row.click:active{ filter: brightness(1.25); }
  @media (prefers-reduced-motion: reduce){
    button:not(:disabled):active{ transform: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ===== Вход ===== -->
  <section id="screen-login" hidden>
    <h1><span class="brand" data-cfg="appName">ElvA</span> · админ</h1>
    <div class="card">
      <label for="l-email">Почта</label>
      <input id="l-email" type="email" autocomplete="username" inputmode="email">
      <label for="l-pass">Пароль</label>
      <input id="l-pass" type="password" autocomplete="current-password">
      <div class="msg" id="l-msg"></div>
      <div class="btn-stack">
        <button class="btn-primary" id="l-btn" onclick="doLogin()">Войти</button>
        <button class="btn-ghost" onclick="doForgot()">Забыли пароль?</button>
      </div>
    </div>
  </section>

  <!-- ===== Новый пароль по ссылке из письма ===== -->
  <section id="screen-recovery" hidden>
    <h1><span class="brand" data-cfg="appName">ElvA</span> · новый пароль</h1>
    <div class="card">
      <label for="r-pass">Новый пароль</label>
      <input id="r-pass" type="password" autocomplete="new-password">
      <label for="r-pass2">Ещё раз</label>
      <input id="r-pass2" type="password" autocomplete="new-password">
      <div class="msg" id="r-msg"></div>
      <button class="btn-primary" onclick="doRecoverySave()">Сохранить</button>
    </div>
  </section>

  <!-- ===== Панель ===== -->
  <section id="screen-panel" hidden>
    <h1><span class="brand" data-cfg="appName">ElvA</span> · админ</h1>
    <div class="who" id="who"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="tab-body"></div>
  </section>

</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Настройки (адрес сервера, название, город) — общий файл с приложением. -->
<script src="elva-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Без этого пустого обработчика iPhone не показывает :active у кнопок.
  document.addEventListener('touchstart', () => {}, { passive: true });
  // ---------- настройки ----------
  // Общий файл с приложением — elva-config.js (адрес сервера, название, город).
  const CFG = Object.assign({ supabaseUrl: '', supabaseAnonKey: '', appName: 'Такси', cityGenitive: '' },
                            window.ELVA_CONFIG || {});
  const CFG_PROBLEM = !window.ELVA_CONFIG ? 'Нет файла настроек elva-config.js. Загрузите его рядом с admin.html.'
    : !window.supabase ? 'Нет связи с сервером. Проверьте интернет и обновите страницу.'
    : (!CFG.supabaseUrl || !CFG.supabaseAnonKey) ? 'В elva-config.js не вписаны адрес или ключ сервера.'
    : '';
  const SUPABASE_URL = CFG.supabaseUrl;
  const SUPABASE_ANON_KEY = CFG.supabaseAnonKey;
  const MIN_PASSWORD = 10;
  document.title = CFG.appName + ' · Админ-панель';
  document.querySelectorAll('[data-cfg]').forEach(el => { el.textContent = CFG[el.dataset.cfg] || ''; });

  // storageKey — свой, не как у приложения: если в одном Safari открыты и
  // приложение, и панель, они не «выкидывают» друг друга.
  const sb = CFG_PROBLEM ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'elva-admin-auth', persistSession: true, detectSessionInUrl: true }
  });

  let me = { email: '' };
  // Открыли по ссылке из письма «сбросить пароль» — в адресе будет type=recovery.
  let recoveryMode = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);

  // ---------- мелочи ----------
  const $ = id => document.getElementById(id);
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function show(screen){
    for(const id of ['screen-login', 'screen-recovery', 'screen-panel']) $(id).hidden = id !== screen;
  }
  function msg(id, text, kind){
    const el = $(id);
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function fmtTime(ts){
    if(!ts) return '—';
    return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  // Ошибки входа — по-русски.
  function authError(e){
    const m = (e && e.message || '').toLowerCase();
    if(m.includes('invalid login')) return 'Неверная почта или пароль.';
    if(m.includes('rate') || m.includes('too many')) return 'Слишком много попыток. Подождите несколько минут.';
    if(m.includes('not confirmed')) return 'Почта не подтверждена. Подтвердите её в Supabase (Authentication → Users).';
    if(m.includes('should be different') || m.includes('same')) return 'Новый пароль должен отличаться от старого.';
    if(m.includes('weak') || m.includes('at least')) return 'Пароль слишком простой. Возьмите длиннее и сложнее.';
    return 'Ошибка: ' + (e && e.message || 'неизвестная');
  }

  // ---------- вход ----------
  async function doLogin(){
    const email = $('l-email').value.trim();
    const password = $('l-pass').value;
    if(CFG_PROBLEM){ msg('l-msg', CFG_PROBLEM, 'error'); return; }
    if(!email || !password){ msg('l-msg', 'Введите почту и пароль.', 'error'); return; }
    $('l-btn').disabled = true;
    msg('l-msg', 'Входим…');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $('l-btn').disabled = false;
    if(error){ msg('l-msg', authError(error), 'error'); return; }
    $('l-pass').value = '';
    await enterPanel(true);
  }

  // Ссылка для сброса пароля придёт на почту и откроет эту же страницу.
  async function doForgot(){
    const email = $('l-email').value.trim();
    if(CFG_PROBLEM){ msg('l-msg', CFG_PROBLEM, 'error'); return; }
    if(!email){ msg('l-msg', 'Сначала впишите почту — на неё придёт ссылка.', 'error'); return; }
    const redirectTo = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if(error){ msg('l-msg', authError(error), 'error'); return; }
    msg('l-msg', 'Если эта почта — администратора, на неё придёт письмо со ссылкой. Проверьте и папку «Спам».', 'ok');
  }

  async function doRecoverySave(){
    const p1 = $('r-pass').value, p2 = $('r-pass2').value;
    if(p1.length < MIN_PASSWORD){ msg('r-msg', `Пароль — не короче ${MIN_PASSWORD} символов.`, 'error'); return; }
    if(p1 !== p2){ msg('r-msg', 'Пароли не совпадают.', 'error'); return; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error){ msg('r-msg', authError(error), 'error'); return; }
    recoveryMode = false;
    history.replaceState(null, '', location.pathname);
    try { await sb.rpc('admin_note_password_changed'); } catch(e){}
    await enterPanel(true);
  }

  async function doLogout(){
    await sb.auth.signOut();
    me = { email: '' };
    show('screen-login');
    msg('l-msg', '');
  }

  // Вошли. Спрашиваем базу, админ ли это. Если нет — выходим.
  // logLogin — записать вход в журнал (только после ввода пароля, а не при
  // каждом открытии страницы с сохранённым входом).
  async function enterPanel(logLogin){
    const { data, error } = await sb.rpc('admin_whoami', { p_log: !!logLogin });
    const row = data && data[0];
    if(error || !row || !row.is_admin){
      await sb.auth.signOut();
      show('screen-login');
      msg('l-msg', error ? 'Не удалось проверить права: ' + error.message
                         : 'У этой учётной записи нет прав администратора.', 'error');
      return;
    }
    me = { email: row.email };
    $('who').innerHTML = '<span>' + esc(me.email) + '</span><button class="link" onclick="doLogout()">Выйти</button>';
    show('screen-panel');
    renderTabs();
    openTab(currentTab);
  }

  // ---------- вкладки ----------
  // Люди, Заказы и Цифры появятся в следующих частях.
  const TABS = [
    { id: 'people',  title: 'Люди',   render: renderPeople },
    { id: 'orders',  title: 'Заказы', render: renderOrders },
    { id: 'stats',   title: 'Цифры',  render: renderStats },
    { id: 'log',     title: 'Журнал', render: renderLog },
    { id: 'admins',  title: 'Админы', render: renderAdmins },
    { id: 'account', title: 'Пароль', render: renderAccount }
  ];
  let currentTab = 'people';

  function renderTabs(){
    $('tabs').innerHTML = TABS.map(t =>
      `<button class="tab ${t.id === currentTab ? 'active' : ''}" onclick="openTab('${t.id}')">${t.title}</button>`).join('');
  }
  function openTab(id){
    currentTab = id;
    clearInterval(ordersTimer);
    renderTabs();
    const tab = TABS.find(t => t.id === id) || TABS[0];
    $('tab-body').innerHTML = '';
    tab.render();
  }
  function soon(text){
    $('tab-body').innerHTML = `<div class="card soon">${esc(text)}</div>`;
  }

  // ---------- журнал ----------
  const ACTION_NAMES = {
    login: 'Вход в панель',
    password_changed: 'Сменил пароль',
    view_person: 'Открыл карточку',
    order_cancel: 'Отменил заказ',
    order_complete: 'Завершил заказ',
    ban: 'Заблокировал',
    unban: 'Снял блокировку'
  };
  let logLastId = null;

  async function renderLog(more){
    if(!more){
      logLastId = null;
      $('tab-body').innerHTML = `<div class="card"><h2>Журнал действий</h2><div id="log-list" class="muted small">Загружаем…</div>
        <button class="btn-call" id="log-more" hidden onclick="renderLog(true)">Показать ещё</button></div>`;
    }
    const { data, error } = await sb.rpc('admin_log_list', { p_limit: 50, p_before_id: logLastId });
    const list = $('log-list');
    if(!list) return;
    if(error){ list.textContent = 'Ошибка: ' + error.message; return; }
    if(!more) list.innerHTML = '';
    if(!data.length && !more){ list.textContent = 'Пока пусто.'; return; }
    list.classList.remove('muted', 'small');
    list.classList.add('rows');
    list.insertAdjacentHTML('beforeend', data.map(r => `
      <div class="row">
        <div class="row-main">${esc(ACTION_NAMES[r.action] || r.action)}${r.target ? ' · ' + esc(r.target) : ''}</div>
        <div class="row-sub">${esc(fmtTime(r.created_at))} · ${esc(r.admin_email || '—')}${
          r.action === 'ban' && r.details ? ' · ' + esc(banKind(r.details.scope)) + ', ' + esc(banUntil(r.details.until)) : ''}${
          r.details && r.details.reason ? ' · причина: ' + esc(r.details.reason) : ''}</div>
      </div>`).join(''));
    if(data.length) logLastId = data[data.length - 1].id;
    $('log-more').hidden = data.length < 50;
  }

  // ---------- люди: поиск ----------
  // Запрос и найденное помним, чтобы «← К поиску» возвращал к тем же результатам.
  let peopleQuery = '';
  let peopleResults = null;

  const isWide = () => window.matchMedia('(min-width: 900px)').matches;
  let selectedPersonId = null;

  function renderPeople(){
    $('tab-body').innerHTML = `<div class="people-split"><div id="people-left"><div class="card">
      <h2>Поиск человека</h2>
      <div class="search-row">
        <input id="p-q" type="search" placeholder="Номер или имя" autocomplete="off" value="${esc(peopleQuery)}">
        <button class="btn-primary" onclick="doSearch()">Найти</button>
      </div>
      <div class="note plain">Номер можно в любом виде или последние цифры, имя — частью.</div>
      <div id="p-results"></div>
    </div></div><div id="people-right">${isWide()
      ? '<div class="card people-empty">Найдите человека и выберите его в списке слева.</div>' : ''}</div></div>`;
    $('p-q').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
    if(peopleResults) showResults(peopleResults);
    if(isWide() && selectedPersonId) openPerson(selectedPersonId);
  }

  async function doSearch(){
    const q = $('p-q').value.trim();
    peopleQuery = q;
    const box = $('p-results');
    if(q.length < 2){ box.innerHTML = '<div class="msg error">Введите хотя бы 2 символа.</div>'; return; }
    box.innerHTML = '<div class="msg muted">Ищем…</div>';
    const { data, error } = await sb.rpc('admin_search_people', { p_q: q });
    if(error){ box.innerHTML = `<div class="msg error">Ошибка: ${esc(error.message)}</div>`; return; }
    peopleResults = data;
    showResults(data);
  }

  function showResults(list){
    const box = $('p-results');
    if(!box) return;
    if(!list.length){ box.innerHTML = '<div class="msg muted">Никого не нашли.</div>'; return; }
    box.innerHTML = `<div class="rows">` + list.map(p => `
      <div class="row click ${p.id === selectedPersonId ? 'sel' : ''}" onclick="openPerson('${p.id}')">
        <div class="row-main">${esc(p.name || 'Без имени')}${p.is_driver ? '<span class="tag">водитель</span>' : ''}${
          p.ban_scope ? `<span class="tag red">${p.ban_scope === 'all' ? 'заблокирован' : 'бан водителя'}</span>` : ''}</div>
        <div class="row-sub">${esc(p.phone)} · с ${esc(fmtDate(p.created_at))}${p.last_active_at ? ' · был ' + esc(fmtTime(p.last_active_at)) : ''}</div>
      </div>`).join('') + (list.length === 20 ? '<div class="note">Показаны первые 20. Уточните запрос.</div>' : '') + `</div>`;
  }

  function fmtDate(ts){
    if(!ts) return '—';
    return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function plural(n, one, few, many){
    const a = Math.abs(n) % 100, b = a % 10;
    if(a > 10 && a < 20) return many;
    if(b > 1 && b < 5) return few;
    if(b === 1) return one;
    return many;
  }

  // ---------- люди: карточка ----------
  const STATUS = {
    searching:   ['Ищет водителя', 'live'],
    accepted:    ['Водитель едет', 'live'],
    arrived:     ['Водитель на месте', 'live'],
    in_progress: ['В пути', 'live'],
    done:        ['Выполнен', 'done']
  };
  function statusLabel(o){
    if(o.status === 'cancelled'){
      const who = o.cancelled_by === 'driver' ? 'Отменил водитель' : o.cancelled_by === 'passenger' ? 'Отменил пассажир' : 'Отменён';
      return `<span class="order-status cancelled">${who}</span>`;
    }
    const s = STATUS[o.status] || [o.status, ''];
    return `<span class="order-status ${s[1]}">${esc(s[0])}</span>`;
  }
  function ratingText(sum, count){
    if(!count) return 'нет оценок';
    return (sum / count).toFixed(1).replace('.', ',') + ' из 5 · ' + count + ' ' + plural(count, 'оценка', 'оценки', 'оценок');
  }

  // ---------- блокировка ----------
  function banKind(scope){ return scope === 'driver' ? 'только как водитель' : 'полностью'; }
  function banUntil(until){
    if(!until) return 'бессрочно';
    return 'до ' + new Date(until).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  let banForm = { scope: 'all', days: 1, custom: '' };
  let currentPerson = null;

  const BAN_TERMS = [[1, '1 день'], [3, '3 дня'], [7, '7 дней'], [30, '30 дней'], [0, 'Навсегда'], ['custom', 'Своя дата']];

  function banSection(d){
    const b = d.active_ban;
    if(b){
      return `<div class="card">
        <h2>Блокировка</h2>
        <div class="ban-box">
          <b>Заблокирован ${esc(banKind(b.scope))}</b>, ${esc(banUntil(b.until))}<br>
          Причина: ${esc(b.reason)}<br>
          <span class="muted small">Поставил ${esc(b.created_by_email || '—')}, ${esc(fmtTime(b.created_at))}</span>
        </div>
        <button class="btn-call" onclick="doUnban()">Снять блокировку</button>
      </div>`;
    }
    const trip = d.active_trip;
    return `<div class="card">
      <h2>Заблокировать</h2>
      <label>Вид</label>
      <div class="chips">
        <button class="chip ${banForm.scope === 'all' ? 'on' : ''}" onclick="setBanForm('scope','all')">Полностью</button>
        <button class="chip ${banForm.scope === 'driver' ? 'on' : ''}" onclick="setBanForm('scope','driver')">Только как водителя</button>
      </div>
      <label>Срок</label>
      <div class="chips cols3">
        ${BAN_TERMS.map(([v, t]) => `<button class="chip ${banForm.days === v ? 'on' : ''}" onclick="setBanForm('days', ${typeof v === 'number' ? v : "'custom'"})">${t}</button>`).join('')}
      </div>
      ${banForm.days === 'custom' ? `<input id="ban-date" type="datetime-local" value="${esc(banForm.custom)}" onchange="banForm.custom=this.value">` : ''}
      <label for="ban-reason">Причина (видят только админы)</label>
      <textarea id="ban-reason" placeholder="Например: не приехал на 3 заказа подряд"></textarea>
      ${trip ? `<div class="warn"><b>Идёт поездка</b> (${trip.role === 'driver' ? 'он водитель' : 'он пассажир'}). Блокировка её не прервёт — поездку можно будет довезти и завершить.</div>` : ''}
      <div class="form-error" id="ban-err"></div>
      <button class="btn-call" onclick="doBan()">Заблокировать…</button>
    </div>`;
  }

  function historySection(d){
    const list = (d.bans || []).filter(b => !d.active_ban || b.id !== d.active_ban.id);
    if(!list.length) return '';
    return `<div class="card"><h2>Прошлые блокировки</h2><div class="rows">` + list.map(b => `
      <div class="row">
        <div class="row-main">${esc(b.scope === 'driver' ? 'Только как водитель' : 'Полностью')}, ${esc(banUntil(b.until))}</div>
        <div class="row-sub">Причина: ${esc(b.reason)}</div>
        <div class="row-sub">Поставил ${esc(b.created_by_email || '—')}, ${esc(fmtTime(b.created_at))}${
          b.lifted_at ? ` · снял ${esc(b.lifted_by_email || '—')}, ${esc(fmtTime(b.lifted_at))}` : ' · срок вышел'}</div>
      </div>`).join('') + `</div></div>`;
  }

  function setBanForm(key, value){
    const reason = $('ban-reason') ? $('ban-reason').value : '';
    banForm[key] = value;
    if(key === 'days' && value === 'custom' && !banForm.custom){
      const t = new Date(Date.now() + 24 * 3600 * 1000);
      t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
      banForm.custom = t.toISOString().slice(0, 16);
    }
    $('ban-slot').innerHTML = banSection(currentPerson);
    if($('ban-reason')) $('ban-reason').value = reason;
  }

  async function doBan(){
    const reason = $('ban-reason').value.trim();
    const err = t => { $('ban-err').textContent = t; };
    err('');
    if(!reason){ err('Напишите причину блокировки.'); $('ban-reason').focus(); return; }
    let until = null;
    if(banForm.days === 'custom'){
      if(!banForm.custom){ err('Выберите дату окончания.'); return; }
      until = new Date(banForm.custom);
      if(!(until > new Date())){ err('Дата окончания должна быть в будущем.'); return; }
    } else if(banForm.days){
      until = new Date(Date.now() + banForm.days * 24 * 3600 * 1000);
    }
    const p = currentPerson.profile;
    const trip = currentPerson.active_trip;
    const ok = await confirmSheet({
      title: 'Заблокировать?',
      text: `${p.name || 'Без имени'} — ${banKind(banForm.scope)}, ${banUntil(until)}.`
        + (banForm.scope === 'driver' ? ' Пассажиром пользоваться сможет.' : ' Войти в приложение сможет, но заказывать и возить — нет.')
        + (trip ? ' Идущую поездку можно будет довезти.' : ''),
      okText: 'Заблокировать', cancelText: 'Не блокировать', danger: true
    });
    if(!ok) return;
    const { error } = await sb.rpc('admin_ban', {
      p_profile: p.id, p_scope: banForm.scope, p_until: until ? until.toISOString() : null, p_reason: reason
    });
    if(error){ showToast('Не получилось: ' + error.message, 4000); return; }
    banForm = { scope: 'all', days: 1, custom: '' };
    showToast('Заблокирован');
    openPerson(p.id);
  }

  async function doUnban(){
    const p = currentPerson.profile;
    const ok = await confirmSheet({
      title: 'Снять блокировку?',
      text: `${p.name || 'Без имени'} снова сможет заказывать и возить.`,
      okText: 'Снять блокировку', cancelText: 'Оставить'
    });
    if(!ok) return;
    const { error } = await sb.rpc('admin_unban', { p_profile: p.id });
    if(error){ showToast('Не получилось: ' + error.message, 4000); return; }
    showToast('Блокировка снята');
    openPerson(p.id);
  }

  // Куда выводить карточку: на компьютере — справа от поиска,
  // на телефоне — вместо поиска, с кнопкой «← К поиску».
  function personTarget(){
    if(isWide()){
      if(currentTab !== 'people' || !$('people-right')){ currentTab = 'people'; renderTabs(); renderPeopleShell(); }
      return $('people-right');
    }
    if(currentTab !== 'people'){ currentTab = 'people'; renderTabs(); clearInterval(ordersTimer); }
    return $('tab-body');
  }
  function renderPeopleShell(){
    const keep = selectedPersonId; selectedPersonId = null;
    renderPeople();
    selectedPersonId = keep;
  }
  const BACK = () => isWide() ? '' : `<button class="link back" onclick="renderPeople()">← К поиску</button>`;

  // «А123ВС14» -> «А123ВС 14»
  function carPlateText(p){
    const m = /^(.)(\d{3})(..)(\d{2,3})$/.exec(p || '');
    return m ? m[1] + m[2] + m[3] + ' ' + m[4] : (p || '');
  }

  async function openPerson(id){
    selectedPersonId = id;
    if(isWide() && peopleResults) showResults(peopleResults);
    const target = personTarget();
    target.innerHTML = `${BACK()}<div class="card"><div class="msg muted">Загружаем…</div></div>`;
    const { data, error } = await sb.rpc('admin_person', { p_id: id });
    if(error){
      target.innerHTML = `${BACK()}<div class="card"><div class="msg error">Ошибка: ${esc(error.message)}</div></div>`;
      return;
    }
    currentPerson = data;
    const p = data.profile, pas = data.passenger, drv = data.driver;
    const inAppNow = p.app_seen_at && (Date.now() - Date.parse(p.app_seen_at) < 30000);
    const tel = String(p.phone || '').replace(/[^\d+]/g, '');

    target.innerHTML = `
      ${BACK()}
      <div class="person-grid">
      <div class="card wide">
        <h2>${esc(p.name || 'Без имени')}${drv ? '<span class="tag">водитель</span>' : ''}${
          data.active_ban ? `<span class="tag red">${data.active_ban.scope === 'all' ? 'заблокирован' : 'бан водителя'}</span>` : ''}</h2>
        <a class="phone-link" href="tel:${esc(tel)}">${esc(p.phone)}</a>
        <dl class="kv">
          <dt>Регистрация</dt><dd>${esc(fmtDate(p.created_at))}</dd>
          <dt>В приложении</dt><dd>${inAppNow
              ? '<b style="color:var(--success)">сейчас</b>, как ' + (p.app_role === 'driver' ? 'водитель' : 'пассажир')
              : (p.last_active_at ? esc(fmtTime(p.last_active_at)) : 'нет данных')}</dd>
          <dt>Уведомления</dt><dd>${data.devices ? 'включены · ' + data.devices + ' ' + plural(data.devices, 'устройство', 'устройства', 'устройств') : 'выключены'}</dd>
          <dt>Входов</dt><dd>${data.sessions} ${plural(data.sessions, 'устройство', 'устройства', 'устройств')}</dd>
        </dl>
      </div>

      <div id="ban-slot" class="wide">${banSection(data)}</div>
      ${historySection(data) ? `<div class="wide">${historySection(data)}</div>` : ''}

      <div class="card">
        <h2>Как пассажир</h2>
        <div class="stat-line">Рейтинг: ${esc(ratingText(pas.rating_sum, pas.rating_count))}</div>
        <div class="stat-line">Поездок: ${pas.done} · отменил сам: ${pas.cancelled_self} · отменил водитель: ${pas.cancelled_other}</div>
      </div>

      ${drv ? `<div class="card">
        <h2>Как водитель</h2>
        <div class="stat-line">Рейтинг: ${esc(ratingText(drv.rating_sum, drv.rating_count))}</div>
        <div class="stat-line">Поездок: ${drv.done} · отменил сам: ${drv.cancelled_self} · отменил пассажир: ${drv.cancelled_other}</div>
        <div class="stat-line">Уведомления о заказах: ${drv.is_available ? 'включены («Свободен»)' : 'выключены («Занят»)'}</div>
        <div class="stat-line">Машина: ${drv.car
          ? esc(drv.car.model + ', ' + drv.car.color + ', ' + carPlateText(drv.car.plate))
          : '<span class="muted">не добавлена — принимать заказы не может</span>'}</div>
      </div>` : ''}

      <div class="card wide">
        <h2>Последние заказы</h2>
        ${data.orders.length ? '<div class="rows">' + data.orders.map(o => `
          <div class="row">
            <div class="row-main">${esc(o.from_address)} → ${esc(o.to_address)}</div>
            <div class="row-sub">${esc(fmtTime(o.created_at))} · ${esc(o.price)} ₽ · как ${o.role === 'driver' ? 'водитель' : 'пассажир'}</div>
            <div class="row-sub">${statusLabel(o)}${o.other_id
                ? ` · ${o.role === 'driver' ? 'пассажир' : 'водитель'}: <button class="link-inline" onclick="openPerson('${esc(o.other_id)}')">${esc(o.other_name || 'без имени')}</button>`
                : ''}</div>
          </div>`).join('') + '</div>' : '<div class="muted small">Заказов пока нет.</div>'}
      </div>
      </div>`;
  }

  // ---------- заказы ----------
  // Список живых заказов. Пока вкладка открыта, обновляется раз в 30 секунд.
  const ORDER_STATUS = {
    searching:   'Ищет водителя',
    accepted:    'Водитель едет',
    arrived:     'Водитель на месте',
    in_progress: 'В пути'
  };
  let ordersTimer = null;

  function ago(ts){
    const min = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 60000));
    if(min < 60) return min + ' мин';
    const h = Math.floor(min / 60), m = min % 60;
    return h + ' ч' + (m ? ' ' + m + ' мин' : '');
  }

  async function renderOrders(){
    clearInterval(ordersTimer);
    if(!$('orders-list')){
      $('tab-body').innerHTML = `<div class="card">
        <div class="orders-head"><h2>Активные заказы</h2>
          <button class="link" onclick="renderOrders()">Обновить</button></div>
        <div class="note plain">Красным — зависшие: поиск дольше 30 мин, водитель едет или ждёт дольше 2 ч, в пути дольше 3 ч.</div>
        <div id="orders-list" class="muted small">Загружаем…</div>
      </div>`;
    }
    const { data, error } = await sb.rpc('admin_active_orders');
    const box = $('orders-list');
    if(!box) return;
    if(error){ box.textContent = 'Ошибка: ' + error.message; return; }
    box.classList.remove('muted', 'small');
    if(!data.length){
      box.innerHTML = '<div class="muted">Сейчас активных заказов нет.</div>';
    } else {
      const stuck = data.filter(o => o.stuck).length;
      box.innerHTML = (stuck ? `<div class="stuck-badge small" style="margin-bottom:12px">Зависших: ${stuck}</div>` : '')
        + `<div class="orders-list">` + data.map(orderRow).join('') + `</div>`;
    }
    ordersTimer = setInterval(() => { if(currentTab === 'orders') renderOrders(); else clearInterval(ordersTimer); }, 30000);
  }

  function personLink(id, name, phone, role){
    if(!id) return `<span class="muted">${role}: —</span>`;
    const tel = String(phone || '').replace(/[^\d+]/g, '');
    return `${role}: <button class="link-inline" onclick="openPerson('${esc(id)}')">${esc(name || 'без имени')}</button>`
      + (phone ? ` · <a href="tel:${esc(tel)}">${esc(phone)}</a>` : '');
  }

  function orderRow(o){
    return `<div class="order ${o.stuck ? 'stuck' : ''}">
      <div>
        <div class="order-route">${esc(o.from_address)} → ${esc(o.to_address)}</div>
        <div class="order-meta">№${o.id} · <span class="price">${esc(o.price)} ₽</span> · <span class="order-status ${o.stuck ? 'cancelled' : 'live'}">${esc(ORDER_STATUS[o.status] || o.status)}</span> уже ${esc(ago(o.status_since))}${
          o.stuck ? ' · <span class="stuck-badge">завис</span>' : ''}${
          o.status === 'searching' ? ' · предложений: ' + o.offers : ''}</div>
        ${o.comment ? `<div class="order-meta">Комментарий: ${esc(o.comment)}</div>` : ''}
      </div>
      <div class="order-people">
        <div>${personLink(o.passenger_id, o.passenger_name, o.passenger_phone, 'Пассажир')}</div>
        <div>${o.driver_id ? personLink(o.driver_id, o.driver_name, o.driver_phone, 'Водитель') : '<span class="muted">Водитель ещё не выбран</span>'}</div>
      </div>
      <div class="btn-stack">
        ${o.status !== 'searching' ? `<button class="btn-call" onclick="adminCompleteOrder(${o.id})">Завершить как выполненный</button>` : ''}
        <button class="btn-ghost" onclick="adminCancelOrder(${o.id})">Отменить заказ</button>
      </div>
    </div>`;
  }

  async function adminCancelOrder(id){
    const res = await confirmSheet({
      title: `Отменить заказ №${id}?`,
      text: 'Пассажир и водитель получат уведомление «Заказ отменён поддержкой».',
      reason: true, okText: 'Отменить заказ', cancelText: 'Не отменять', danger: true
    });
    if(!res) return;
    const { error } = await sb.rpc('admin_order_cancel', { p_order_id: id, p_reason: res.reason });
    if(error){ showToast('Не получилось: ' + error.message, 4000); renderOrders(); return; }
    showToast('Заказ отменён');
    renderOrders();
  }

  async function adminCompleteOrder(id){
    const res = await confirmSheet({
      title: `Завершить заказ №${id}?`,
      text: 'Он уйдёт в историю как обычная выполненная поездка.',
      reason: true, okText: 'Завершить как выполненный', cancelText: 'Не завершать'
    });
    if(!res) return;
    const { error } = await sb.rpc('admin_order_complete', { p_order_id: id, p_reason: res.reason });
    if(error){ showToast('Не получилось: ' + error.message, 4000); renderOrders(); return; }
    showToast('Заказ завершён');
    renderOrders();
  }

  // ---------- цифры ----------
  let statsDays = 7;
  const STATS_PERIODS = [[1, 'Сегодня'], [7, '7 дней'], [30, '30 дней']];

  function tile(num, label, sub, kind){
    return `<div class="tile ${kind || ''}"><div class="num">${num}</div><div class="lbl">${esc(label)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  }
  function money(n){ return Number(n || 0).toLocaleString('ru-RU') + ' ₽'; }

  async function renderStats(){
    $('tab-body').innerHTML = `<div class="card">
      <div class="orders-head"><h2>Цифры</h2><button class="link" onclick="renderStats()">Обновить</button></div>
      <div class="chips cols3">${STATS_PERIODS.map(([d, t]) =>
        `<button class="chip ${statsDays === d ? 'on' : ''}" onclick="statsDays=${d};renderStats()">${t}</button>`).join('')}</div>
      <div id="stats-body" class="muted small">Считаем…</div>
    </div>`;
    const { data, error } = await sb.rpc('admin_stats', { p_days: statsDays });
    const box = $('stats-body');
    if(!box) return;
    if(error){ box.textContent = 'Ошибка: ' + error.message; return; }
    box.classList.remove('muted', 'small');
    const o = data.orders, pp = data.people, now = data.now;

    let chart = '';
    if(statsDays > 1 && data.days && data.days.length){
      const max = Math.max(1, ...data.days.map(d => d.done + d.cancelled));
      chart = `<h2 class="sec">По дням</h2>
        <div class="chart">${data.days.map(d => `
          <div class="bar" title="${esc(d.day)}: выполнено ${d.done}, отменено ${d.cancelled}">
            <div class="d" style="height:${d.done / max * 100}%"></div>
            <div class="c" style="height:${d.cancelled / max * 100}%"></div>
          </div>`).join('')}</div>
        <div class="chart-labels">${data.days.map((d, i) => {
          const day = Number(d.day.slice(8));
          const show = data.days.length <= 10 || i % 5 === 0 || i === data.days.length - 1;
          return `<span>${show ? day : ''}</span>`;
        }).join('')}</div>
        <div class="legend"><span><i style="background:var(--success)"></i>выполнено</span><span><i style="background:var(--danger)"></i>отменено</span></div>`;
    }

    box.innerHTML = `
      <h2>Сейчас</h2>
      <div class="tiles">
        ${tile(now.in_app, 'в приложении')}
        ${tile(now.drivers_free, 'водителей «Свободен»')}
        ${tile(now.active_orders, 'активных заказов', '', now.active_orders ? 'ice' : '')}
      </div>

      <h2 class="sec">Заказы</h2>
      <div class="tiles">
        ${tile(o.created, 'создано')}
        ${tile(o.done, 'выполнено', '', 'good')}
        ${tile(o.cancelled, 'отменено',
            `пассажиром ${o.cancelled_passenger} · водителем ${o.cancelled_driver} · поддержкой ${o.cancelled_admin}`, o.cancelled ? 'bad' : '')}
        ${tile(o.done_share == null ? '—' : o.done_share + '%', 'доезжают', 'доля выполненных среди завершившихся')}
        ${tile(money(o.turnover), 'оборот', 'сумма выполненных поездок', 'money')}
        ${tile(o.avg_find_min == null ? '—' : String(o.avg_find_min).replace('.', ',') + ' мин', 'поиск водителя', 'в среднем от заказа до выбора')}
      </div>

      <h2 class="sec">Люди</h2>
      <div class="tiles">
        ${tile(pp.new, 'новых')}
        ${tile(pp.active, 'заходили', 'считается с 25 сентября')}
        ${tile(pp.drivers_worked, 'водителей работали', 'выбраны хотя бы на 1 заказ')}
      </div>
      ${chart}
      <div class="note">${statsDays === 1 || !data.days || !data.days.length
        ? 'С полуночи'
        : 'С ' + new Date(data.days[0].day + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}${CFG.cityGenitive ? ' по времени ' + esc(CFG.cityGenitive) : ''}.</div>`;
  }

  // ---------- администраторы ----------
  async function renderAdmins(){
    $('tab-body').innerHTML = `<div class="card"><h2>Администраторы</h2><div id="adm-list" class="muted small">Загружаем…</div>
      <div class="note">
        Добавить администратора пока можно через Supabase:<br>
        1) Authentication → Users → Add user: почта, пароль, «Auto Confirm User».<br>
        2) SQL Editor: <code>insert into public.admins (user_id, email) select id, email from auth.users where email = 'почта';</code><br>
        Убрать: <code>delete from public.admins where email = 'почта';</code><br>
        Кнопки для этого прямо здесь появятся отдельной доработкой.
      </div></div>`;
    const { data, error } = await sb.rpc('admin_list_admins');
    const list = $('adm-list');
    if(error){ list.textContent = 'Ошибка: ' + error.message; return; }
    list.classList.remove('muted', 'small');
    list.classList.add('rows');
    list.innerHTML = data.map(a => `
      <div class="row">
        <div class="row-main">${esc(a.email)}${a.email === me.email ? ' <span class="muted small">(это вы)</span>' : ''}</div>
        <div class="row-sub">Админ с ${esc(fmtTime(a.created_at))} · последний вход ${esc(fmtTime(a.last_sign_in_at))}</div>
      </div>`).join('');
  }

  // ---------- смена пароля ----------
  function renderAccount(){
    $('tab-body').innerHTML = `<div class="card"><h2>Сменить пароль</h2>
      <label for="a-old">Текущий пароль</label>
      <input id="a-old" type="password" autocomplete="current-password">
      <label for="a-new">Новый пароль</label>
      <input id="a-new" type="password" autocomplete="new-password">
      <label for="a-new2">Новый пароль ещё раз</label>
      <input id="a-new2" type="password" autocomplete="new-password">
      <div class="msg" id="a-msg"></div>
      <button class="btn-primary" id="a-btn" onclick="doChangePassword()">Сменить пароль</button>
      <div class="note">Не короче ${MIN_PASSWORD} символов. Удобно взять 3–4 случайных слова, например «лёд-сова-мост-47».</div>
    </div>`;
  }

  async function doChangePassword(){
    const oldP = $('a-old').value, p1 = $('a-new').value, p2 = $('a-new2').value;
    if(!oldP){ msg('a-msg', 'Введите текущий пароль.', 'error'); return; }
    if(p1.length < MIN_PASSWORD){ msg('a-msg', `Новый пароль — не короче ${MIN_PASSWORD} символов.`, 'error'); return; }
    if(p1 !== p2){ msg('a-msg', 'Новые пароли не совпадают.', 'error'); return; }
    $('a-btn').disabled = true;
    // Сначала проверяем текущий пароль: без этого пароль мог бы сменить
    // любой, кто на минуту взял ваш телефон с открытой панелью.
    const check = await sb.auth.signInWithPassword({ email: me.email, password: oldP });
    if(check.error){
      $('a-btn').disabled = false;
      msg('a-msg', check.error.message.toLowerCase().includes('invalid login') ? 'Текущий пароль неверный.' : authError(check.error), 'error');
      return;
    }
    const { error } = await sb.auth.updateUser({ password: p1 });
    $('a-btn').disabled = false;
    if(error){ msg('a-msg', authError(error), 'error'); return; }
    try { await sb.rpc('admin_note_password_changed'); } catch(e){}
    for(const id of ['a-old', 'a-new', 'a-new2']) $(id).value = '';
    msg('a-msg', 'Пароль изменён.', 'ok');
  }

  // ---------- окно подтверждения, сообщение внизу ----------
  // Окно снизу экрана (на компьютере — по центру), как в приложении.
  // reason: true — в окне поле «Причина», без него основная кнопка бледная.
  // Возвращает false, если передумали, или { reason } при согласии.
  function confirmSheet({ title, text, okText, cancelText, danger, reason }){
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'confirm-overlay';
      wrap.innerHTML = `
        <div class="confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
          <div class="confirm-title" id="confirm-title">${esc(title)}</div>
          <p class="confirm-text">${esc(text)}</p>
          ${reason ? `<label for="confirm-reason">Причина (видят только админы)</label>
            <textarea id="confirm-reason" placeholder="Коротко, что случилось"></textarea>` : ''}
          <div class="btn-stack">
            <button class="${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok" ${reason ? 'disabled' : ''}>${esc(okText)}</button>
            <button class="btn-call confirm-no" data-act="no">${esc(cancelText)}</button>
          </div>
        </div>`;
      const field = wrap.querySelector('#confirm-reason');
      const okBtn = wrap.querySelector('[data-act="ok"]');
      if(field) field.addEventListener('input', () => { okBtn.disabled = !field.value.trim(); });
      function close(result){
        wrap.classList.remove('open');
        setTimeout(() => wrap.remove(), 200);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onKey(e){ if(e.key === 'Escape') close(false); }
      wrap.addEventListener('click', e => {
        const act = e.target.closest('[data-act]');
        if(act && !act.disabled) close(act.dataset.act === 'ok' ? { reason: field ? field.value.trim() : '' } : false);
        else if(e.target === wrap) close(false);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      void wrap.offsetWidth;
      wrap.classList.add('open');
      (field || wrap.querySelector('.confirm-no')).focus();
    });
  }

  let toastTimer = null;
  function showToast(text, ms){
    const el = $('toast');
    clearTimeout(toastTimer);
    el.textContent = text;
    el.hidden = false;
    void el.offsetWidth;
    el.classList.add('show');
    toastTimer = setTimeout(() => {
      el.classList.remove('show');
      toastTimer = setTimeout(() => { el.hidden = true; }, 250);
    }, ms || 2200);
  }

  // Действия, которые ждут сервер: пока ждём, повторные нажатия той же
  // кнопки молча отбрасываются (без двойных отмен и блокировок).
  let lastTapButton = null;
  document.addEventListener('click', e => {
    lastTapButton = e.target.closest ? e.target.closest('button') : null;
  }, true);
  function busyAction(fn){
    return async function(...args){
      const btn = lastTapButton;
      lastTapButton = null;
      if(btn){
        if(btn.dataset.busy) return;
        btn.dataset.busy = '1';
      }
      try {
        return await fn.apply(this, args);
      } finally {
        if(btn) delete btn.dataset.busy;
      }
    };
  }
  [
    'doLogin', 'doForgot', 'doRecoverySave', 'doChangePassword', 'doSearch',
    'doBan', 'doUnban', 'adminCancelOrder', 'adminCompleteOrder'
  ].forEach(name => {
    if(typeof window[name] === 'function') window[name] = busyAction(window[name]);
    else console.warn('busyAction: нет функции', name);
  });

  // Enter в полях входа = «Войти».
  for(const id of ['l-email', 'l-pass']){
    $(id).addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  }

  // ---------- запуск ----------
  // Если открыли по ссылке из письма «сбросить пароль», Supabase сам
  // подхватит её и пришлёт событие PASSWORD_RECOVERY.
  // Нет настроек или библиотеки — показываем причину на экране входа и дальше не идём.
  if(CFG_PROBLEM){
    show('screen-login');
    msg('l-msg', CFG_PROBLEM, 'error');
  } else {
  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY'){
      recoveryMode = true;
      show('screen-recovery');
    }
  });

  (async () => {
    if(recoveryMode){ show('screen-recovery'); return; }
    const { data } = await sb.auth.getSession();
    if(recoveryMode) return;
    if(data.session && !data.session.user.is_anonymous) await enterPanel();
    else show('screen-login');
  })();
  }
</script>
</body>
