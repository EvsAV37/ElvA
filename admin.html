<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>html, body{ background: #03070a; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03070a">
<title>ElvA · Админ-панель</title>
<link rel="preload" href="elva-manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="elva-unbounded.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family: 'Manrope';
    src: url('elva-manrope.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: block;
  }
  @font-face{
    font-family: 'Unbounded';
    src: url('elva-unbounded.woff2') format('woff2');
    font-weight: 500 700; font-style: normal; font-display: block;
  }
  :root{
    --night: #10142A;
    --surface: #1A2044;
    --surface-2: #232B58;
    --ice: #8FE0E8;
    --ice-dim: #5C7A8A;
    --amber: #F2A65A;
    --text: #EDEFF5;
    --muted: #8089AC;
    --success: #7FD9A6;
    --danger: #E8737B;
    --line: rgba(237,239,245,0.09);
    --radius: 16px;
  }
  *{ box-sizing: border-box; }
  html{ background: #03070a; -webkit-text-size-adjust: 100%; }
  body{
    margin: 0; min-height: 100vh;
    background: var(--night);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .shell{ max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1, h2{ font-family: 'Unbounded', sans-serif; font-weight: 600; margin: 0; }
  h1{ font-size: 22px; }
  h2{ font-size: 17px; margin-bottom: 12px; }
  .brand{ color: var(--ice); }
  .muted{ color: var(--muted); }
  .small{ font-size: 13px; }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-top: 14px;
  }
  label{ display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  input{
    width: 100%; padding: 13px 14px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-size: 16px;
  }
  input:focus{ outline: none; border-color: var(--ice-dim); }
  button{ font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn{
    width: 100%; margin-top: 16px; padding: 14px;
    border: none; border-radius: 12px;
    background: var(--ice); color: #0b2226;
    font-weight: 700; font-size: 15px;
  }
  .btn:disabled{ opacity: 0.5; cursor: default; }
  .btn-ghost{
    width: 100%; margin-top: 10px; padding: 12px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 12px;
    font-weight: 600; font-size: 14px;
  }
  .link{ background: none; border: none; color: var(--ice); font-weight: 600; font-size: 14px; padding: 8px 0; margin-top: 8px; }
  .msg{ margin-top: 12px; font-size: 14px; line-height: 1.5; }
  .msg.error{ color: var(--danger); }
  .msg.ok{ color: var(--success); }

  /* Шапка и вкладки */
  .who{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 6px; font-size: 13px; color: var(--muted);
  }
  .who span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .who .link{ margin: 0; padding: 4px 0; flex-shrink: 0; }
  .tabs{
    display: flex; gap: 8px; overflow-x: auto; margin: 16px -16px 0; padding: 0 16px 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; padding: 9px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-weight: 600; font-size: 13.5px;
  }
  .tab.active{ background: var(--surface-2); color: var(--ice); border-color: var(--ice-dim); }

  /* Списки */
  .row{ padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child{ border-bottom: none; }
  .row-main{ font-weight: 600; }
  .row-sub{ font-size: 13px; color: var(--muted); margin-top: 2px; }
  .soon{ text-align: center; color: var(--muted); padding: 28px 8px; }
  .note{
    font-size: 13px; color: var(--muted); line-height: 1.6;
    border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px;
  }
  .note code{ color: var(--text); font-size: 12.5px; }
  /* Люди */
  .search-row{ display: flex; gap: 8px; }
  .search-row input{ flex: 1; }
  .search-row .btn{ width: auto; margin-top: 0; padding: 0 18px; }
  .row.click{ cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .row.click:active{ opacity: 0.7; }
  .tag{
    display: inline-block; font-size: 11.5px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px;
    background: var(--surface-2); color: var(--ice);
  }
  .tag.amber{ color: var(--amber); }
  .kv{ display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt{ color: var(--muted); }
  .kv dd{ margin: 0; }
  .phone-link{ color: var(--ice); font-weight: 700; text-decoration: none; font-size: 17px; }
  .back{ background: none; border: none; color: var(--ice); font-weight: 600; font-size: 14px; padding: 12px 0 0; }
  .stat-line{ font-size: 14px; margin-top: 4px; }
  .order-status{ font-size: 12.5px; font-weight: 700; }
  .order-status.done{ color: var(--success); }
  .order-status.cancelled{ color: var(--danger); }
  .order-status.live{ color: var(--amber); }
  .link-inline{ background: none; border: none; padding: 0; color: var(--ice); font: inherit; font-weight: 600; cursor: pointer; }
  /* Блокировка */
  .tag.red{ color: var(--danger); }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    padding: 9px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  }
  .chip.on{ color: var(--text); border-color: var(--ice-dim); background: #2c3668; }
  .ban-box{
    border: 1px solid rgba(232,115,123,0.45); background: rgba(232,115,123,0.08);
    border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.6;
  }
  .ban-box b{ color: var(--danger); }
  .warn{ color: var(--amber); font-size: 13.5px; margin-top: 12px; line-height: 1.5; }
  .btn-danger{
    width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 12px;
    background: var(--danger); color: #2a0b0e; font-weight: 700; font-size: 15px;
  }
  textarea{
    width: 100%; min-height: 70px; padding: 12px 14px; resize: vertical;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-size: 16px;
  }
  textarea:focus{ outline: none; border-color: var(--ice-dim); }
  /* Заказы */
  .orders-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .orders-head .link{ margin: 0; }
  .order{ border-top: 1px solid var(--line); padding: 14px 0; }
  .order:first-of-type{ border-top: none; }
  .order.stuck{
    border: 1px solid rgba(232,115,123,0.5); border-radius: 12px;
    padding: 12px; margin: 8px 0; background: rgba(232,115,123,0.06);
  }
  .order .who-line{ font-size: 13.5px; margin-top: 4px; }
  .order .who-line a{ color: var(--muted); text-decoration: none; }
  .order-actions{ display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn-sm{
    padding: 9px 12px; border-radius: 10px; font-weight: 700; font-size: 13px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  }
  .btn-sm.danger{ color: var(--danger); border-color: rgba(232,115,123,0.45); }
  .stuck-badge{ color: var(--danger); font-weight: 700; font-size: 12.5px; }
  .people-empty{ text-align: center; color: var(--muted); padding: 40px 12px; }

  /* ===== Компьютер: меню слева, содержимое справа, карточка рядом с поиском ===== */
  .people-split{ display: block; }
  #people-right:empty{ display: none; }
  @media (min-width: 900px){
    .shell{ max-width: 1240px; padding: 28px 32px 48px; }
    #screen-login .card, #screen-recovery .card{ max-width: 420px; }
    #screen-panel:not([hidden]){
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      grid-template-areas: "head who" "nav body";
      column-gap: 32px; row-gap: 8px; align-items: start;
    }
    #screen-panel > h1{ grid-area: head; align-self: center; }
    #screen-panel > .who{ grid-area: who; margin-top: 0; justify-content: flex-end; gap: 20px; }
    #screen-panel > .tabs{
      grid-area: nav; flex-direction: column; margin: 8px 0 0; padding: 0; overflow: visible;
      position: sticky; top: 20px;
    }
    #screen-panel > .tabs .tab{ text-align: left; border-radius: 10px; padding: 11px 14px; font-size: 14.5px; }
    #tab-body{ grid-area: body; min-width: 0; }
    .card{ margin-top: 8px; }
    .people-split{ display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
    #people-right:empty{ display: block; }
    #people-left{ position: sticky; top: 20px; }
    .person-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; align-items: start; }
    .person-grid > .wide{ grid-column: 1 / -1; }
    .orders-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 20px; }
    .orders-grid .order{ border-top: 1px solid var(--line); }
    .row.click:hover{ background: rgba(255,255,255,0.03); }
    .row.click.sel{ background: rgba(143,224,232,0.07); border-radius: 8px; }
    .people-mobile-back{ display: none; }
  }
  [hidden]{ display: none !important; }
</style>
</head>
<body>
<div class="shell">

  <!-- ===== Вход ===== -->
  <section id="screen-login" hidden>
    <h1><span class="brand">ElvA</span> · админ</h1>
    <div class="card">
      <label for="l-email">Почта</label>
      <input id="l-email" type="email" autocomplete="username" inputmode="email">
      <label for="l-pass">Пароль</label>
      <input id="l-pass" type="password" autocomplete="current-password">
      <button class="btn" id="l-btn" onclick="doLogin()">Войти</button>
      <button class="link" onclick="doForgot()">Забыли пароль?</button>
      <div class="msg" id="l-msg"></div>
    </div>
  </section>

  <!-- ===== Новый пароль по ссылке из письма ===== -->
  <section id="screen-recovery" hidden>
    <h1><span class="brand">ElvA</span> · новый пароль</h1>
    <div class="card">
      <label for="r-pass">Новый пароль</label>
      <input id="r-pass" type="password" autocomplete="new-password">
      <label for="r-pass2">Ещё раз</label>
      <input id="r-pass2" type="password" autocomplete="new-password">
      <button class="btn" onclick="doRecoverySave()">Сохранить</button>
      <div class="msg" id="r-msg"></div>
    </div>
  </section>

  <!-- ===== Панель ===== -->
  <section id="screen-panel" hidden>
    <h1><span class="brand">ElvA</span> · админ</h1>
    <div class="who" id="who"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="tab-body"></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---------- настройки ----------
  // Те же адрес и ключ, что в index.html (ключ публичный, данные защищает база).
  const SUPABASE_URL = 'https://uoqaaemktxcumcsdmhpj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_58ozWUWGOSBIC6A0CUMQjw_ZBkPKXss';
  const MIN_PASSWORD = 10;

  // storageKey — свой, не как у приложения: если в одном Safari открыты и
  // приложение, и панель, они не «выкидывают» друг друга.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'elva-admin-auth', persistSession: true, detectSessionInUrl: true }
  });

  let me = { email: '' };
  // Открыли по ссылке из письма «сбросить пароль» — в адресе будет type=recovery.
  let recoveryMode = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);

  // ---------- мелочи ----------
  const $ = id => document.getElementById(id);
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function show(screen){
    for(const id of ['screen-login', 'screen-recovery', 'screen-panel']) $(id).hidden = id !== screen;
  }
  function msg(id, text, kind){
    const el = $(id);
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function fmtTime(ts){
    if(!ts) return '—';
    return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  // Ошибки входа — по-русски.
  function authError(e){
    const m = (e && e.message || '').toLowerCase();
    if(m.includes('invalid login')) return 'Неверная почта или пароль.';
    if(m.includes('rate') || m.includes('too many')) return 'Слишком много попыток. Подождите несколько минут.';
    if(m.includes('not confirmed')) return 'Почта не подтверждена. Подтвердите её в Supabase (Authentication → Users).';
    if(m.includes('should be different') || m.includes('same')) return 'Новый пароль должен отличаться от старого.';
    if(m.includes('weak') || m.includes('at least')) return 'Пароль слишком простой. Возьмите длиннее и сложнее.';
    return 'Ошибка: ' + (e && e.message || 'неизвестная');
  }

  // ---------- вход ----------
  async function doLogin(){
    const email = $('l-email').value.trim();
    const password = $('l-pass').value;
    if(!email || !password){ msg('l-msg', 'Введите почту и пароль.', 'error'); return; }
    $('l-btn').disabled = true;
    msg('l-msg', 'Входим…');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $('l-btn').disabled = false;
    if(error){ msg('l-msg', authError(error), 'error'); return; }
    $('l-pass').value = '';
    await enterPanel(true);
  }

  // Ссылка для сброса пароля придёт на почту и откроет эту же страницу.
  async function doForgot(){
    const email = $('l-email').value.trim();
    if(!email){ msg('l-msg', 'Сначала впишите почту — на неё придёт ссылка.', 'error'); return; }
    const redirectTo = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if(error){ msg('l-msg', authError(error), 'error'); return; }
    msg('l-msg', 'Если эта почта — администратора, на неё придёт письмо со ссылкой. Проверьте и папку «Спам».', 'ok');
  }

  async function doRecoverySave(){
    const p1 = $('r-pass').value, p2 = $('r-pass2').value;
    if(p1.length < MIN_PASSWORD){ msg('r-msg', `Пароль — не короче ${MIN_PASSWORD} символов.`, 'error'); return; }
    if(p1 !== p2){ msg('r-msg', 'Пароли не совпадают.', 'error'); return; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error){ msg('r-msg', authError(error), 'error'); return; }
    recoveryMode = false;
    history.replaceState(null, '', location.pathname);
    try { await sb.rpc('admin_note_password_changed'); } catch(e){}
    await enterPanel(true);
  }

  async function doLogout(){
    await sb.auth.signOut();
    me = { email: '' };
    show('screen-login');
    msg('l-msg', '');
  }

  // Вошли. Спрашиваем базу, админ ли это. Если нет — выходим.
  // logLogin — записать вход в журнал (только после ввода пароля, а не при
  // каждом открытии страницы с сохранённым входом).
  async function enterPanel(logLogin){
    const { data, error } = await sb.rpc('admin_whoami', { p_log: !!logLogin });
    const row = data && data[0];
    if(error || !row || !row.is_admin){
      await sb.auth.signOut();
      show('screen-login');
      msg('l-msg', error ? 'Не удалось проверить права: ' + error.message
                         : 'У этой учётной записи нет прав администратора.', 'error');
      return;
    }
    me = { email: row.email };
    $('who').innerHTML = '<span>' + esc(me.email) + '</span><button class="link" onclick="doLogout()">Выйти</button>';
    show('screen-panel');
    renderTabs();
    openTab(currentTab);
  }

  // ---------- вкладки ----------
  // Люди, Заказы и Цифры появятся в следующих частях.
  const TABS = [
    { id: 'people',  title: 'Люди',   render: renderPeople },
    { id: 'orders',  title: 'Заказы', render: renderOrders },
    { id: 'stats',   title: 'Цифры',  render: () => soon('Заказы, отмены, новые люди, водители в сети — в части 5.') },
    { id: 'log',     title: 'Журнал', render: renderLog },
    { id: 'admins',  title: 'Админы', render: renderAdmins },
    { id: 'account', title: 'Пароль', render: renderAccount }
  ];
  let currentTab = 'people';

  function renderTabs(){
    $('tabs').innerHTML = TABS.map(t =>
      `<button class="tab ${t.id === currentTab ? 'active' : ''}" onclick="openTab('${t.id}')">${t.title}</button>`).join('');
  }
  function openTab(id){
    currentTab = id;
    clearInterval(ordersTimer);
    renderTabs();
    const tab = TABS.find(t => t.id === id) || TABS[0];
    $('tab-body').innerHTML = '';
    tab.render();
  }
  function soon(text){
    $('tab-body').innerHTML = `<div class="card soon">${esc(text)}</div>`;
  }

  // ---------- журнал ----------
  const ACTION_NAMES = {
    login: 'Вход в панель',
    password_changed: 'Сменил пароль',
    view_person: 'Открыл карточку',
    order_cancel: 'Отменил заказ',
    order_complete: 'Завершил заказ',
    ban: 'Заблокировал',
    unban: 'Снял блокировку'
  };
  let logLastId = null;

  async function renderLog(more){
    if(!more){
      logLastId = null;
      $('tab-body').innerHTML = `<div class="card"><h2>Журнал действий</h2><div id="log-list" class="muted small">Загружаем…</div>
        <button class="btn-ghost" id="log-more" hidden onclick="renderLog(true)">Показать ещё</button></div>`;
    }
    const { data, error } = await sb.rpc('admin_log_list', { p_limit: 50, p_before_id: logLastId });
    const list = $('log-list');
    if(!list) return;
    if(error){ list.textContent = 'Ошибка: ' + error.message; return; }
    if(!more) list.innerHTML = '';
    if(!data.length && !more){ list.textContent = 'Пока пусто.'; return; }
    list.classList.remove('muted', 'small');
    list.insertAdjacentHTML('beforeend', data.map(r => `
      <div class="row">
        <div class="row-main">${esc(ACTION_NAMES[r.action] || r.action)}${r.target ? ' · ' + esc(r.target) : ''}</div>
        <div class="row-sub">${esc(fmtTime(r.created_at))} · ${esc(r.admin_email || '—')}${
          r.action === 'ban' && r.details ? ' · ' + esc(banKind(r.details.scope)) + ', ' + esc(banUntil(r.details.until)) : ''}${
          r.details && r.details.reason ? ' · причина: ' + esc(r.details.reason) : ''}</div>
      </div>`).join(''));
    if(data.length) logLastId = data[data.length - 1].id;
    $('log-more').hidden = data.length < 50;
  }

  // ---------- люди: поиск ----------
  // Запрос и найденное помним, чтобы «← К поиску» возвращал к тем же результатам.
  let peopleQuery = '';
  let peopleResults = null;

  const isWide = () => window.matchMedia('(min-width: 900px)').matches;
  let selectedPersonId = null;

  function renderPeople(){
    $('tab-body').innerHTML = `<div class="people-split"><div id="people-left"><div class="card">
      <h2>Поиск человека</h2>
      <div class="search-row">
        <input id="p-q" type="search" placeholder="Номер или имя" autocomplete="off" value="${esc(peopleQuery)}">
        <button class="btn" onclick="doSearch()">Найти</button>
      </div>
      <div class="note" style="border:none;margin-top:8px;padding-top:0">Номер можно в любом виде или последние цифры, имя — частью.</div>
      <div id="p-results"></div>
    </div></div><div id="people-right">${isWide()
      ? '<div class="card people-empty">Найдите человека и выберите его в списке слева.</div>' : ''}</div></div>`;
    $('p-q').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
    if(peopleResults) showResults(peopleResults);
    if(isWide() && selectedPersonId) openPerson(selectedPersonId);
  }

  async function doSearch(){
    const q = $('p-q').value.trim();
    peopleQuery = q;
    const box = $('p-results');
    if(q.length < 2){ box.innerHTML = '<div class="msg error">Введите хотя бы 2 символа.</div>'; return; }
    box.innerHTML = '<div class="msg muted">Ищем…</div>';
    const { data, error } = await sb.rpc('admin_search_people', { p_q: q });
    if(error){ box.innerHTML = `<div class="msg error">Ошибка: ${esc(error.message)}</div>`; return; }
    peopleResults = data;
    showResults(data);
  }

  function showResults(list){
    const box = $('p-results');
    if(!box) return;
    if(!list.length){ box.innerHTML = '<div class="msg muted">Никого не нашли.</div>'; return; }
    box.innerHTML = `<div style="margin-top:8px">` + list.map(p => `
      <div class="row click ${p.id === selectedPersonId ? 'sel' : ''}" onclick="openPerson('${p.id}')">
        <div class="row-main">${esc(p.name || 'Без имени')}${p.is_driver ? '<span class="tag amber">водитель</span>' : ''}${
          p.ban_scope ? `<span class="tag red">${p.ban_scope === 'all' ? 'заблокирован' : 'бан водителя'}</span>` : ''}</div>
        <div class="row-sub">${esc(p.phone)} · с ${esc(fmtDate(p.created_at))}${p.last_active_at ? ' · был ' + esc(fmtTime(p.last_active_at)) : ''}</div>
      </div>`).join('') + (list.length === 20 ? '<div class="note">Показаны первые 20. Уточните запрос.</div>' : '') + `</div>`;
  }

  function fmtDate(ts){
    if(!ts) return '—';
    return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function plural(n, one, few, many){
    const a = Math.abs(n) % 100, b = a % 10;
    if(a > 10 && a < 20) return many;
    if(b > 1 && b < 5) return few;
    if(b === 1) return one;
    return many;
  }

  // ---------- люди: карточка ----------
  const STATUS = {
    searching:   ['Ищет водителя', 'live'],
    accepted:    ['Водитель едет', 'live'],
    arrived:     ['Водитель на месте', 'live'],
    in_progress: ['В пути', 'live'],
    done:        ['Выполнен', 'done']
  };
  function statusLabel(o){
    if(o.status === 'cancelled'){
      const who = o.cancelled_by === 'driver' ? 'Отменил водитель' : o.cancelled_by === 'passenger' ? 'Отменил пассажир' : 'Отменён';
      return `<span class="order-status cancelled">${who}</span>`;
    }
    const s = STATUS[o.status] || [o.status, ''];
    return `<span class="order-status ${s[1]}">${esc(s[0])}</span>`;
  }
  function ratingText(sum, count){
    if(!count) return 'нет оценок';
    return (sum / count).toFixed(1).replace('.', ',') + ' из 5 · ' + count + ' ' + plural(count, 'оценка', 'оценки', 'оценок');
  }

  // ---------- блокировка ----------
  function banKind(scope){ return scope === 'driver' ? 'только как водитель' : 'полностью'; }
  function banUntil(until){
    if(!until) return 'бессрочно';
    return 'до ' + new Date(until).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  let banForm = { scope: 'all', days: 1, custom: '' };
  let currentPerson = null;

  const BAN_TERMS = [[1, '1 день'], [3, '3 дня'], [7, '7 дней'], [30, '30 дней'], [0, 'Навсегда'], ['custom', 'Своя дата']];

  function banSection(d){
    const b = d.active_ban;
    if(b){
      return `<div class="card">
        <h2>Блокировка</h2>
        <div class="ban-box">
          <b>Заблокирован ${esc(banKind(b.scope))}</b>, ${esc(banUntil(b.until))}<br>
          Причина: ${esc(b.reason)}<br>
          <span class="muted small">Поставил ${esc(b.created_by_email || '—')}, ${esc(fmtTime(b.created_at))}</span>
        </div>
        <button class="btn-ghost" onclick="doUnban()">Снять блокировку</button>
      </div>`;
    }
    const trip = d.active_trip;
    return `<div class="card">
      <h2>Заблокировать</h2>
      <label>Вид</label>
      <div class="chips">
        <button class="chip ${banForm.scope === 'all' ? 'on' : ''}" onclick="setBanForm('scope','all')">Полностью</button>
        <button class="chip ${banForm.scope === 'driver' ? 'on' : ''}" onclick="setBanForm('scope','driver')">Только как водителя</button>
      </div>
      <label>Срок</label>
      <div class="chips">
        ${BAN_TERMS.map(([v, t]) => `<button class="chip ${banForm.days === v ? 'on' : ''}" onclick="setBanForm('days', ${typeof v === 'number' ? v : "'custom'"})">${t}</button>`).join('')}
      </div>
      ${banForm.days === 'custom' ? `<input id="ban-date" type="datetime-local" style="margin-top:10px" value="${esc(banForm.custom)}" onchange="banForm.custom=this.value">` : ''}
      <label for="ban-reason">Причина (видят только админы)</label>
      <textarea id="ban-reason" placeholder="Например: не приехал на 3 заказа подряд"></textarea>
      ${trip ? `<div class="warn">Внимание: у человека идёт поездка (${trip.role === 'driver' ? 'он водитель' : 'он пассажир'}). Блокировка её не прервёт — поездку можно будет довезти и завершить.</div>` : ''}
      <button class="btn-danger" onclick="doBan()">Заблокировать</button>
    </div>`;
  }

  function historySection(d){
    const list = (d.bans || []).filter(b => !d.active_ban || b.id !== d.active_ban.id);
    if(!list.length) return '';
    return `<div class="card"><h2>Прошлые блокировки</h2>` + list.map(b => `
      <div class="row">
        <div class="row-main">${esc(b.scope === 'driver' ? 'Только как водитель' : 'Полностью')}, ${esc(banUntil(b.until))}</div>
        <div class="row-sub">Причина: ${esc(b.reason)}</div>
        <div class="row-sub">Поставил ${esc(b.created_by_email || '—')}, ${esc(fmtTime(b.created_at))}${
          b.lifted_at ? ` · снял ${esc(b.lifted_by_email || '—')}, ${esc(fmtTime(b.lifted_at))}` : ' · срок вышел'}</div>
      </div>`).join('') + `</div>`;
  }

  function setBanForm(key, value){
    const reason = $('ban-reason') ? $('ban-reason').value : '';
    banForm[key] = value;
    if(key === 'days' && value === 'custom' && !banForm.custom){
      const t = new Date(Date.now() + 24 * 3600 * 1000);
      t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
      banForm.custom = t.toISOString().slice(0, 16);
    }
    $('ban-slot').innerHTML = banSection(currentPerson);
    if($('ban-reason')) $('ban-reason').value = reason;
  }

  async function doBan(){
    const reason = $('ban-reason').value.trim();
    if(!reason){ alert('Напишите причину блокировки.'); return; }
    let until = null;
    if(banForm.days === 'custom'){
      if(!banForm.custom){ alert('Выберите дату окончания.'); return; }
      until = new Date(banForm.custom);
      if(!(until > new Date())){ alert('Дата окончания должна быть в будущем.'); return; }
    } else if(banForm.days){
      until = new Date(Date.now() + banForm.days * 24 * 3600 * 1000);
    }
    const p = currentPerson.profile;
    const text = `Заблокировать ${p.name || 'этого человека'} ${banKind(banForm.scope)}, ${banUntil(until)}?`;
    if(!confirm(text)) return;
    const { error } = await sb.rpc('admin_ban', {
      p_profile: p.id, p_scope: banForm.scope, p_until: until ? until.toISOString() : null, p_reason: reason
    });
    if(error){ alert('Не получилось: ' + error.message); return; }
    banForm = { scope: 'all', days: 1, custom: '' };
    openPerson(p.id);
  }

  async function doUnban(){
    const p = currentPerson.profile;
    if(!confirm(`Снять блокировку с ${p.name || 'этого человека'}?`)) return;
    const { error } = await sb.rpc('admin_unban', { p_profile: p.id });
    if(error){ alert('Не получилось: ' + error.message); return; }
    openPerson(p.id);
  }

  // Куда выводить карточку: на компьютере — справа от поиска,
  // на телефоне — вместо поиска, с кнопкой «← К поиску».
  function personTarget(){
    if(isWide()){
      if(currentTab !== 'people' || !$('people-right')){ currentTab = 'people'; renderTabs(); renderPeopleShell(); }
      return $('people-right');
    }
    if(currentTab !== 'people'){ currentTab = 'people'; renderTabs(); clearInterval(ordersTimer); }
    return $('tab-body');
  }
  function renderPeopleShell(){
    const keep = selectedPersonId; selectedPersonId = null;
    renderPeople();
    selectedPersonId = keep;
  }
  const BACK = () => isWide() ? '' : `<button class="back" onclick="renderPeople()">← К поиску</button>`;

  async function openPerson(id){
    selectedPersonId = id;
    if(isWide() && peopleResults) showResults(peopleResults);
    const target = personTarget();
    target.innerHTML = `${BACK()}<div class="card"><div class="msg muted">Загружаем…</div></div>`;
    const { data, error } = await sb.rpc('admin_person', { p_id: id });
    if(error){
      target.innerHTML = `${BACK()}<div class="card"><div class="msg error">Ошибка: ${esc(error.message)}</div></div>`;
      return;
    }
    currentPerson = data;
    const p = data.profile, pas = data.passenger, drv = data.driver;
    const inAppNow = p.app_seen_at && (Date.now() - Date.parse(p.app_seen_at) < 30000);
    const tel = String(p.phone || '').replace(/[^\d+]/g, '');

    target.innerHTML = `
      ${BACK()}
      <div class="person-grid">
      <div class="card wide">
        <h2>${esc(p.name || 'Без имени')}${drv ? '<span class="tag amber">водитель</span>' : ''}${
          data.active_ban ? `<span class="tag red">${data.active_ban.scope === 'all' ? 'заблокирован' : 'бан водителя'}</span>` : ''}</h2>
        <a class="phone-link" href="tel:${esc(tel)}">${esc(p.phone)}</a>
        <dl class="kv" style="margin-top:14px">
          <dt>Регистрация</dt><dd>${esc(fmtDate(p.created_at))}</dd>
          <dt>В приложении</dt><dd>${inAppNow
              ? '<span style="color:var(--success);font-weight:700">сейчас</span>, как ' + (p.app_role === 'driver' ? 'водитель' : 'пассажир')
              : (p.last_active_at ? esc(fmtTime(p.last_active_at)) : 'нет данных')}</dd>
          <dt>Уведомления</dt><dd>${data.devices ? 'включены · ' + data.devices + ' ' + plural(data.devices, 'устройство', 'устройства', 'устройств') : 'выключены'}</dd>
          <dt>Входов</dt><dd>${data.sessions} ${plural(data.sessions, 'устройство', 'устройства', 'устройств')}</dd>
        </dl>
      </div>

      <div id="ban-slot" class="wide">${banSection(data)}</div>
      ${historySection(data) ? `<div class="wide">${historySection(data)}</div>` : ''}

      <div class="card">
        <h2>Как пассажир</h2>
        <div class="stat-line">Рейтинг: ${esc(ratingText(pas.rating_sum, pas.rating_count))}</div>
        <div class="stat-line">Поездок: ${pas.done} · отменил сам: ${pas.cancelled_self} · отменил водитель: ${pas.cancelled_other}</div>
      </div>

      ${drv ? `<div class="card">
        <h2>Как водитель</h2>
        <div class="stat-line">Рейтинг: ${esc(ratingText(drv.rating_sum, drv.rating_count))}</div>
        <div class="stat-line">Поездок: ${drv.done} · отменил сам: ${drv.cancelled_self} · отменил пассажир: ${drv.cancelled_other}</div>
        <div class="stat-line">Уведомления о заказах: ${drv.is_available ? 'включены («Свободен»)' : 'выключены («Занят»)'}</div>
      </div>` : ''}

      <div class="card wide">
        <h2>Последние заказы</h2>
        ${data.orders.length ? data.orders.map(o => `
          <div class="row">
            <div class="row-main">${esc(o.from_address)} → ${esc(o.to_address)}</div>
            <div class="row-sub">${esc(fmtTime(o.created_at))} · ${esc(o.price)} ₽ · как ${o.role === 'driver' ? 'водитель' : 'пассажир'}</div>
            <div class="row-sub">${statusLabel(o)}${o.other_id
                ? ` · ${o.role === 'driver' ? 'пассажир' : 'водитель'}: <button class="link-inline" onclick="openPerson('${esc(o.other_id)}')">${esc(o.other_name || 'без имени')}</button>`
                : ''}</div>
          </div>`).join('') : '<div class="muted small">Заказов пока нет.</div>'}
      </div>
      </div>`;
  }

  // ---------- заказы ----------
  // Список живых заказов. Пока вкладка открыта, обновляется раз в 30 секунд.
  const ORDER_STATUS = {
    searching:   'Ищет водителя',
    accepted:    'Водитель едет',
    arrived:     'Водитель на месте',
    in_progress: 'В пути'
  };
  let ordersTimer = null;

  function ago(ts){
    const min = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 60000));
    if(min < 60) return min + ' мин';
    const h = Math.floor(min / 60), m = min % 60;
    return h + ' ч' + (m ? ' ' + m + ' мин' : '');
  }

  async function renderOrders(){
    clearInterval(ordersTimer);
    if(!$('orders-list')){
      $('tab-body').innerHTML = `<div class="card">
        <div class="orders-head"><h2 style="margin:0">Активные заказы</h2>
          <button class="link" onclick="renderOrders()">Обновить</button></div>
        <div class="note" style="border:none;margin-top:4px;padding-top:0">Красным — зависшие: поиск дольше 30 мин, водитель едет или ждёт дольше 2 ч, в пути дольше 3 ч.</div>
        <div id="orders-list" class="muted small">Загружаем…</div>
      </div>`;
    }
    const { data, error } = await sb.rpc('admin_active_orders');
    const box = $('orders-list');
    if(!box) return;
    if(error){ box.textContent = 'Ошибка: ' + error.message; return; }
    box.classList.remove('muted', 'small');
    if(!data.length){
      box.innerHTML = '<div class="muted" style="padding:16px 0">Сейчас активных заказов нет.</div>';
    } else {
      const stuck = data.filter(o => o.stuck).length;
      box.innerHTML = (stuck ? `<div class="stuck-badge" style="margin:6px 0">Зависших: ${stuck}</div>` : '')
        + `<div class="orders-grid">` + data.map(orderRow).join('') + `</div>`;
    }
    ordersTimer = setInterval(() => { if(currentTab === 'orders') renderOrders(); else clearInterval(ordersTimer); }, 30000);
  }

  function personLink(id, name, phone, role){
    if(!id) return `<span class="muted">${role}: —</span>`;
    const tel = String(phone || '').replace(/[^\d+]/g, '');
    return `${role}: <button class="link-inline" onclick="openPerson('${esc(id)}')">${esc(name || 'без имени')}</button>`
      + (phone ? ` · <a href="tel:${esc(tel)}">${esc(phone)}</a>` : '');
  }

  function orderRow(o){
    return `<div class="order ${o.stuck ? 'stuck' : ''}">
      <div class="row-main">${esc(o.from_address)} → ${esc(o.to_address)}</div>
      <div class="row-sub">№${o.id} · ${esc(o.price)} ₽ · <span class="order-status live">${esc(ORDER_STATUS[o.status] || o.status)}</span> уже ${esc(ago(o.status_since))}${
        o.stuck ? ' · <span class="stuck-badge">завис</span>' : ''}${
        o.status === 'searching' ? ' · предложений: ' + o.offers : ''}</div>
      ${o.comment ? `<div class="row-sub">Комментарий: ${esc(o.comment)}</div>` : ''}
      <div class="who-line">${personLink(o.passenger_id, o.passenger_name, o.passenger_phone, 'Пассажир')}</div>
      <div class="who-line">${o.driver_id ? personLink(o.driver_id, o.driver_name, o.driver_phone, 'Водитель') : '<span class="muted">Водитель ещё не выбран</span>'}</div>
      <div class="order-actions">
        <button class="btn-sm danger" onclick="adminCancelOrder(${o.id})">Отменить</button>
        ${o.status !== 'searching' ? `<button class="btn-sm" onclick="adminCompleteOrder(${o.id})">Завершить как выполненный</button>` : ''}
      </div>
    </div>`;
  }

  async function adminCancelOrder(id){
    const reason = prompt(`Отменить заказ №${id}? Пассажир и водитель получат уведомление «Заказ отменён поддержкой».\n\nПричина (видят только админы):`);
    if(reason === null) return;
    if(!reason.trim()){ alert('Без причины отменить нельзя.'); return; }
    const { error } = await sb.rpc('admin_order_cancel', { p_order_id: id, p_reason: reason.trim() });
    if(error){ alert('Не получилось: ' + error.message); return; }
    renderOrders();
  }

  async function adminCompleteOrder(id){
    const reason = prompt(`Завершить заказ №${id} как выполненный? Он уйдёт в историю как обычная поездка.\n\nПричина (видят только админы):`);
    if(reason === null) return;
    if(!reason.trim()){ alert('Без причины завершить нельзя.'); return; }
    const { error } = await sb.rpc('admin_order_complete', { p_order_id: id, p_reason: reason.trim() });
    if(error){ alert('Не получилось: ' + error.message); return; }
    renderOrders();
  }

  // ---------- администраторы ----------
  async function renderAdmins(){
    $('tab-body').innerHTML = `<div class="card"><h2>Администраторы</h2><div id="adm-list" class="muted small">Загружаем…</div>
      <div class="note">
        Добавить администратора пока можно через Supabase:<br>
        1) Authentication → Users → Add user: почта, пароль, «Auto Confirm User».<br>
        2) SQL Editor: <code>insert into public.admins (user_id, email) select id, email from auth.users where email = 'почта';</code><br>
        Убрать: <code>delete from public.admins where email = 'почта';</code><br>
        Кнопки для этого прямо здесь появятся отдельной доработкой.
      </div></div>`;
    const { data, error } = await sb.rpc('admin_list_admins');
    const list = $('adm-list');
    if(error){ list.textContent = 'Ошибка: ' + error.message; return; }
    list.classList.remove('muted', 'small');
    list.innerHTML = data.map(a => `
      <div class="row">
        <div class="row-main">${esc(a.email)}${a.email === me.email ? ' <span class="muted small">(это вы)</span>' : ''}</div>
        <div class="row-sub">Админ с ${esc(fmtTime(a.created_at))} · последний вход ${esc(fmtTime(a.last_sign_in_at))}</div>
      </div>`).join('');
  }

  // ---------- смена пароля ----------
  function renderAccount(){
    $('tab-body').innerHTML = `<div class="card"><h2>Сменить пароль</h2>
      <label for="a-old">Текущий пароль</label>
      <input id="a-old" type="password" autocomplete="current-password">
      <label for="a-new">Новый пароль</label>
      <input id="a-new" type="password" autocomplete="new-password">
      <label for="a-new2">Новый пароль ещё раз</label>
      <input id="a-new2" type="password" autocomplete="new-password">
      <button class="btn" id="a-btn" onclick="doChangePassword()">Сменить пароль</button>
      <div class="msg" id="a-msg"></div>
      <div class="note">Не короче ${MIN_PASSWORD} символов. Удобно взять 3–4 случайных слова, например «лёд-сова-мост-47».</div>
    </div>`;
  }

  async function doChangePassword(){
    const oldP = $('a-old').value, p1 = $('a-new').value, p2 = $('a-new2').value;
    if(!oldP){ msg('a-msg', 'Введите текущий пароль.', 'error'); return; }
    if(p1.length < MIN_PASSWORD){ msg('a-msg', `Новый пароль — не короче ${MIN_PASSWORD} символов.`, 'error'); return; }
    if(p1 !== p2){ msg('a-msg', 'Новые пароли не совпадают.', 'error'); return; }
    $('a-btn').disabled = true;
    // Сначала проверяем текущий пароль: без этого пароль мог бы сменить
    // любой, кто на минуту взял ваш телефон с открытой панелью.
    const check = await sb.auth.signInWithPassword({ email: me.email, password: oldP });
    if(check.error){
      $('a-btn').disabled = false;
      msg('a-msg', check.error.message.toLowerCase().includes('invalid login') ? 'Текущий пароль неверный.' : authError(check.error), 'error');
      return;
    }
    const { error } = await sb.auth.updateUser({ password: p1 });
    $('a-btn').disabled = false;
    if(error){ msg('a-msg', authError(error), 'error'); return; }
    try { await sb.rpc('admin_note_password_changed'); } catch(e){}
    for(const id of ['a-old', 'a-new', 'a-new2']) $(id).value = '';
    msg('a-msg', 'Пароль изменён.', 'ok');
  }

  // Enter в полях входа = «Войти».
  for(const id of ['l-email', 'l-pass']){
    $(id).addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  }

  // ---------- запуск ----------
  // Если открыли по ссылке из письма «сбросить пароль», Supabase сам
  // подхватит её и пришлёт событие PASSWORD_RECOVERY.
  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY'){
      recoveryMode = true;
      show('screen-recovery');
    }
  });

  (async () => {
    if(recoveryMode){ show('screen-recovery'); return; }
    const { data } = await sb.auth.getSession();
    if(recoveryMode) return;
    if(data.session && !data.session.user.is_anonymous) await enterPanel();
    else show('screen-login');
  })();
</script>
</body>
</html>
